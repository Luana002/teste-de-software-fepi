[pytest]
testpaths = tests
markers =
    unit: testes de unidade da logica isolada.
    integration: testes de integracao entre rotas, regras e estado compartilhado.
    system: testes do sistema ponta a ponta com o cliente Flask.
    acceptance: testes orientados aos criterios de aceite do usuario.
    regression: testes para evitar o retorno de bugs corrigidos.
    performance: testes de desempenho com limites de tempo mais folgados.
